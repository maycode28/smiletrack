spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smiletrack-test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
    database-platform: org.hibernate.dialect.H2Dialect
